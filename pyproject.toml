[project]
name = "echoclr"
version = "0.1.0"
description = "Efficient deep learning-based automated diagnosis from echocardiography with contrastive self-supervised learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=1.8.0",
  "torchvision>=0.9.0",
  "torchaudio>=0.8.0",
  "numpy>=1.20.3",
  "pandas>=1.3.4",
  "scipy>=1.7.3",
  "scikit-learn>=1.0.2",
  "scikit-image>=0.19.2",
  "matplotlib>=3.4.3",
  "seaborn>=0.11.2",
  "tqdm>=4.62.3",
  "pyyaml>=6.0",
  "opencv-python>=4.5.4.58",
  "pillow>=8.4.0",
  "imageio>=2.19.1",
  "av>=9.0.1",
  "pytorchvideo>=0.1.5",
  "pytorch-metric-learning>=1.3.0",
  "nibabel>=3.2.2",
  "pydicom>=2.2.2",
  "simpleitk>=2.1.1.2",
  "numba>=0.54.1",
  "mlxtend>=0.19.0",
  "medcam>=0.1.21",
  "torchsummary>=1.5.1",
  "ttach>=0.0.3",
  "yacs>=0.1.8",
  "fvcore>=0.1.5",
  "iopath>=0.1.9",
  "tabulate>=0.8.9",
  "termcolor>=1.1.0",
  "portalocker>=2.4.0",
  "openpyxl>=3.0.9",
  "ruff>=0.15.0",
  "loguru>=0.7.3",
  "zarr>=3.0.0",
  "neurokit2>=0.2.13",
  "s3fs>=2026.2.0",
  "tensorboard>=2.20.0",
]

[project.urls]
Repository = "https://github.com/guyhols/EchoCLR"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--verbose", "--tb=short", "--disable-warnings"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "mypy>=1.0.0",
  "ruff>=0.8.0",
  "ipython>=8.0.0",
  "ipykernel>=6.0.0",
  "jupyter>=1.0.0",
]
